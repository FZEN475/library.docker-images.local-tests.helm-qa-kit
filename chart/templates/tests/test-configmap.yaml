apiVersion: batch/v1
kind: Job
metadata:
  name: "{{ .Release.Name }}-test"
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": test
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: helm-test
    spec:
      containers:
        - name: test
          image: busybox:1.36
          imagePullPolicy: Always
          command: ["sh", "-c", "echo ok"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 10000
            runAsGroup: 10000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
              ephemeral-storage: 64Mi
      restartPolicy: Never
      
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: "{{ .Release.Name }}-test"
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: helm-test
  policyTypes:
    - Ingress
    - Egress